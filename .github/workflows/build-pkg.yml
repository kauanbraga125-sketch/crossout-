name: Build PS4 USB Link Fixer PKG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download OpenOrbis v0.5.4 SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          SDK_URL=$(gh api repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/tags/v0.5.4 \
            --jq '.assets[] | select(.name == "toolchain-llvm-18.tar.gz") | .browser_download_url')
          test -n "$SDK_URL"
          curl --fail --location --retry 3 "$SDK_URL" --output openorbis-sdk.tar.gz
          mkdir -p .openorbis-sdk
          tar -xzf openorbis-sdk.tar.gz -C .openorbis-sdk
          LINK_X=$(find "$GITHUB_WORKSPACE/.openorbis-sdk" -type f -name link.x -print -quit)
          test -n "$LINK_X"
          TOOLCHAIN_ROOT=$(dirname "$LINK_X")
          chmod +x "$TOOLCHAIN_ROOT/bin/linux/"*
          echo "TOOLCHAIN_ROOT=$TOOLCHAIN_ROOT" >> "$GITHUB_ENV"

      - name: Install compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 lld-18

      - name: Generate custom 512x512 RGB menu icon
        run: |
          set -euxo pipefail
          sudo apt-get install -y --no-install-recommends imagemagick
          mkdir -p sce_sys
          base64 --decode assets/icon-cover.jpg.base64 > /tmp/usbfix-cover.jpg
          identify /tmp/usbfix-cover.jpg
          convert /tmp/usbfix-cover.jpg -resize 512x512! -strip -alpha off -type TrueColor PNG24:sce_sys/icon0.png
          identify -format "%m %wx%h %[channels]\\n" sce_sys/icon0.png
          test -s sce_sys/icon0.png

      - name: Run host-side Itemzflow compatibility tests
        run: |
          set -euxo pipefail
          g++ -std=c++11 -Wall -Wextra -Werror tests/path_test.cpp -o /tmp/usbfix-path-test
          /tmp/usbfix-path-test
          g++ -std=c++11 -Wall -Wextra -Werror tests/fixer_test.cpp source/fixer.cpp -o /tmp/usbfix-fixer-test
          /tmp/usbfix-fixer-test
          g++ -std=c++11 -Wall -Wextra -Werror tests/catalog_test.cpp source/catalog.cpp -o /tmp/usbfix-catalog-test
          /tmp/usbfix-catalog-test

      - name: Compile USB Link Fixer
        run: |
          set -euxo pipefail
          export OO_PS4_TOOLCHAIN="$TOOLCHAIN_ROOT"
          make CCX=clang++-18 LD=ld.lld-18 eboot.bin
          test -s eboot.bin

      - name: Validate target executable architecture
        run: |
          set -euxo pipefail
          file build/usb-link-fixer.elf eboot.bin
          readelf -h build/usb-link-fixer.elf
          readelf -h build/usb-link-fixer.elf | grep -q 'ELF64'
          readelf -h build/usb-link-fixer.elf | grep -q 'Advanced Micro Devices X86-64'
          readelf -Ws build/usb-link-fixer.elf | grep -Eq 'main[[:space:]]*$'
          test -s build/usb-link-fixer.oelf

      - name: Build PKG
        run: |
          set -euxo pipefail
          chmod -R a+rwX "$GITHUB_WORKSPACE"
          docker run --rm --user 0:0 \
            --env OO_PS4_TOOLCHAIN=/opt/openorbis \
            --volume "$GITHUB_WORKSPACE:/work" \
            --volume "$TOOLCHAIN_ROOT:/opt/openorbis" \
            --workdir /work \
            ubuntu:20.04 \
            bash -lc '
              set -euxo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y --no-install-recommends make libicu66 libssl1.1 ca-certificates
              make pkg.gp4
              /opt/openorbis/bin/linux/PkgTool.Core pkg_build pkg.gp4 .
            '
          test -s IV0000-ULFX00001_00-USBLINKFIXER0001.pkg

      - name: Validate PKG before publishing
        run: |
          set -euxo pipefail
          python3 tools/validate_pkg.py IV0000-ULFX00001_00-USBLINKFIXER0001.pkg

      - name: Name artifact
        run: |
          set -euxo pipefail
          cp IV0000-ULFX00001_00-USBLINKFIXER0001.pkg PS4-USB-Link-Fixer.pkg
          sha256sum PS4-USB-Link-Fixer.pkg > PS4-USB-Link-Fixer.pkg.sha256

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS4-USB-Link-Fixer-PS4
          path: |
            PS4-USB-Link-Fixer.pkg
            PS4-USB-Link-Fixer.pkg.sha256
          if-no-files-found: error
